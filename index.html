<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14120f">
<title>Apps</title>
<style>
  :root{
    --bg:#14120f;
    --ink:#ece3d4;
    --ink-dim:#8f8474;
    --rule:#2f2a22;
    --gold:#c9a84c;
    --card:#1e1a15;
    --card-hover:#262019;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  /* subtle paper grain */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    opacity:.035;
    background-image:radial-gradient(circle at 1px 1px, #fff 1px, transparent 0);
    background-size:4px 4px;
  }
  .wrap{
    position:relative; z-index:1;
    width:100%; max-width:680px; margin:0 auto;
    padding:56px 24px 64px;
    flex:1;
  }

  header{margin-bottom:44px;}
  .eyebrow{
    font-size:10px; letter-spacing:.34em; text-transform:uppercase;
    color:var(--ink-dim); margin-bottom:14px;
  }
  h1{
    margin:0;
    font-size:clamp(34px,9vw,52px);
    font-weight:400;
    letter-spacing:-.015em;
    line-height:1.05;
  }
  h1 .amp{color:var(--gold); font-style:italic;}
  .tagline{
    margin-top:14px; font-size:16px; color:var(--ink-dim);
    max-width:44ch;
  }
  .rule{
    height:1px; background:var(--rule); margin:34px 0 0;
    position:relative;
  }
  .rule::after{
    content:""; position:absolute; left:0; top:0;
    width:64px; height:1px; background:var(--gold);
  }

  .list{list-style:none; margin:0; padding:0;}
  .list li{margin:0;}

  a.app{
    display:block;
    text-decoration:none;
    color:inherit;
    padding:22px 22px 22px 24px;
    border:1px solid var(--rule);
    border-radius:10px;
    background:var(--card);
    margin-top:14px;
    transition:background .18s ease, border-color .18s ease, transform .18s ease;
    position:relative;
    overflow:hidden;
  }
  a.app::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--gold);
    transform:scaleY(0); transform-origin:top;
    transition:transform .22s ease;
  }
  a.app:hover, a.app:focus-visible{
    background:var(--card-hover);
    border-color:#3d362b;
    transform:translateX(2px);
    outline:none;
  }
  a.app:hover::before, a.app:focus-visible::before{transform:scaleY(1);}

  .app-head{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
  }
  .app-name{
    font-size:21px; letter-spacing:-.01em;
  }
  .app-tag{
    font-size:10px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold); white-space:nowrap;
  }
  .app-desc{
    margin-top:7px; font-size:14.5px; color:var(--ink-dim); max-width:52ch;
  }

  .empty{
    margin-top:14px; padding:26px 22px;
    border:1px dashed var(--rule); border-radius:10px;
    color:var(--ink-dim); font-style:italic; font-size:14px;
  }

  footer{
    position:relative; z-index:1;
    max-width:680px; margin:0 auto; width:100%;
    padding:0 24px 40px;
    font-size:12px; color:var(--ink-dim);
    letter-spacing:.04em;
  }
  footer .fr{height:1px; background:var(--rule); margin-bottom:16px;}

  @media (prefers-reduced-motion:reduce){
    a.app, a.app::before{transition:none;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">A small shelf of tools</div>
    <h1>Apps <span class="amp">&amp;</span> Oracles</h1>
    <p class="tagline">Self-contained study and play tools. Each one runs entirely in your browser &mdash; no account, no server, works offline once it loads.</p>
    <div class="rule"></div>
  </header>

  <ul class="list" id="appList"></ul>
</div>

<footer>
  <div class="fr"></div>
  Bookmark this page. Each app saves its own progress in whatever browser you open it in.
</footer>

<script>
/* ─────────────────────────────────────────────────────────────
   EDIT THIS LIST TO ADD OR CHANGE APPS.

   Each app is one block between { and }. Copy a whole block,
   paste it below the last one, and change the four lines.
   Keep the commas exactly where they are.

     file  — the app's folder name, with a trailing slash
     name  — the title shown on the card
     tag   — the small gold label on the right
     desc  — one or two sentences underneath

   Each app lives in its own folder with its file named
   index.html, so the link is just the folder name — for a
   folder called "star-charts/", the link is "star-charts/".
   ───────────────────────────────────────────────────────────── */

var APPS = [

  {
    file: "hebrew-verbs/",
    name: "Hebrew Verb Drills",
    tag:  "Study",
    desc: "Principal parts and parsing practice across the seven stems. Choose your stems and roots, drill by multiple choice or self-grade."
  },

  {
    file: "mythic/",
    name: "Mythic GME",
    tag:  "Solo Play",
    desc: "A companion for Mythic Game Master Emulator 2nd Edition. Fate questions, chaos factor, scene testing, lists, and meaning tables in one place."
  }

];

/* ── Nothing below here needs editing. ── */

(function(){
  var list = document.getElementById("appList");

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  if(!APPS.length){
    list.innerHTML = '<li><div class="empty">No apps listed yet.</div></li>';
    return;
  }

  list.innerHTML = APPS.map(function(a){
    return '<li><a class="app" href="' + esc(a.file) + '">' +
             '<div class="app-head">' +
               '<span class="app-name">' + esc(a.name) + '</span>' +
               (a.tag ? '<span class="app-tag">' + esc(a.tag) + '</span>' : '') +
             '</div>' +
             (a.desc ? '<div class="app-desc">' + esc(a.desc) + '</div>' : '') +
           '</a></li>';
  }).join("");
})();
</script>
</body>
</html>
